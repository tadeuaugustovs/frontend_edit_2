services:

  # Backend Django
  # Backend Django (Agentes Control Panel)
  backend:
    build:
      context: ./agentes-edite-controlpanel/controlpanel
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - ./agentes-edite-controlpanel/.env
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=painelagentes.settings.local
      - CORS_ALLOWED_ORIGINS=http://localhost:3001,http://localhost:8000,http://localhost:8002,http://127.0.0.1:3001,http://localhost:5173,http://172.20.0.1:5173,http://192.168.70.6:5173,http://127.0.0.1:5173
      - ALLOWED_HOSTS=localhost,backend,0.0.0.0,127.0.0.1
      - HASHIDS_SALT=development_salt
    volumes:
      - ./agentes-edite-controlpanel/controlpanel:/app
      - backend_media:/app/media
    links:
      - postgres
      - redis
      - minio
    restart: always
    network_mode: bridge
    # command is handled by ENTRYPOINT in Dockerfile (which runs entrypoint.sh)

    # Frontend Vue.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8002
    depends_on:
      - backend
    restart: always
    network_mode: bridge

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: meubanco
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    network_mode: bridge

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    restart: always
    network_mode: bridge

  minio:
    image: minio/minio:latest
    ports:
      - "9001:9001"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniosecret
    command: server /data --address ":9002" --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always
    network_mode: bridge

volumes:
  backend_media:
  postgres_data:
  minio_data:
